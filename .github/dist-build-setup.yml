# cargo-dist 构建作业注入步骤（github-build-setup 指向本文件）
# dist 每次重新生成 release.yml 都会带上这里的内容，防投毒校验不丢失

# manylinux_2_28 容器内无 libclang，zt-sys 的 bindgen 生成绑定需要它；
# ubuntu runner 自带(自带 clang)，以 dnf 存在与否区分两种环境
- name: manylinux 容器内安装 libclang(bindgen 依赖)
  shell: bash
  run: |
    command -v dnf >/dev/null 2>&1 || { echo "非 manylinux 容器，跳过"; exit 0; }
    dnf install -y clang-devel

- name: 拉取 ZeroTier 核心源码
  shell: bash
  run: ./scripts/bootstrap.sh

- name: 校验 wintun.dll SHA256
  shell: bash
  run: |
    want="e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce"
    got="$(sha256sum third_party/wintun/wintun.dll | awk '{print $1}')"
    [ "$got" = "$want" ] || {
      echo "wintun.dll SHA256 不符(期望 ${want:0:16}… 实际 ${got:0:16}…)，拒绝发布" >&2
      exit 1
    }

- name: 设置 macOS 部署目标 12.0
  if: runner.os == 'macOS'
  shell: bash
  run: echo "MACOSX_DEPLOYMENT_TARGET=12" >> "$GITHUB_ENV"
