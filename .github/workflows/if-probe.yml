# 一次性探针:排查 planet-port-gui/v* tag 下 gui job 被误跳过的求值问题。
# 触发 tag 为 planet-port-gui/probe.1(无 x.y.z 数字段,不匹配 release.yml
# 的触发 glob)。查清后删除本文件。见 tmp/task8-verify.md 排查记录。
name: if-probe
on:
  push:
    tags: ['planet-port-gui/probe*']

jobs:
  dump:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event_name=[${{ github.event_name }}]"
          echo "ref=[${{ github.ref }}]"
          echo "ref_name=[${{ github.ref_name }}]"
          echo "ref_type=[${{ github.ref_type }}]"
          echo "pull_request=[${{ github.event.pull_request }}]"
          echo "not_pr=[${{ !github.event.pull_request }}]"
          echo "sw_gui=[${{ startsWith(github.ref_name, 'planet-port-gui/') }}]"
          echo "full_if=[${{ !github.event.pull_request && startsWith(github.ref_name, 'planet-port-gui/') }}]"
  # 原样复刻 release.yml gui job 的 if 与 matrix 形态
  exact-if-matrix:
    if: ${{ !github.event.pull_request && startsWith(github.ref_name, 'planet-port-gui/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "leg os=[${{ matrix.os }}] target=[${{ matrix.target }}]"
  # 同一 if 去掉 matrix,隔离 matrix 因素
  exact-if-nomatrix:
    if: ${{ !github.event.pull_request && startsWith(github.ref_name, 'planet-port-gui/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ran
