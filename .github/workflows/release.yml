#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: "manylinux 容器内安装 libclang(bindgen 依赖)"
        run: |
          command -v dnf >/dev/null 2>&1 || { echo "非 manylinux 容器，跳过"; exit 0; }
          dnf install -y clang-devel
        shell: "bash"
      - name: "拉取 ZeroTier 核心源码"
        run: "./scripts/bootstrap.sh"
        shell: "bash"
      - name: "校验 wintun.dll SHA256"
        run: |
          want="e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce"
          got="$(sha256sum third_party/wintun/wintun.dll | awk '{print $1}')"
          [ "$got" = "$want" ] || {
            echo "wintun.dll SHA256 不符(期望 ${want:0:16}… 实际 ${got:0:16}…)，拒绝发布" >&2
            exit 1
          }
        shell: "bash"
      - name: "设置 macOS 部署目标 12.0"
        if: "runner.os == 'macOS'"
        run: "echo \"MACOSX_DEPLOYMENT_TARGET=12\" >> \"$GITHUB_ENV\""
        shell: "bash"
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          # 手工补丁（dist generate 会回退，与上方 token 替换同属人工复查项）：
          # 变更说明取 git-cliff CHANGELOG（scripts/release.sh 组件化后按
          # daemon/cli/gui 分文件生成）对应版本段落，置于 dist 自动生成的
          # 安装/下载表格之前；无对应段落或文件时仅用 dist 说明
          # （精确匹配 `（` 前的完整版本 token，避免前缀误中 beta 段落）
          TAG_PREFIX="${GITHUB_REF_NAME%%/*}"
          case "$TAG_PREFIX" in
              planet-portd)    CL="CHANGELOG-daemon.md" ;;
              planet-port)     CL="CHANGELOG-cli.md" ;;
              planet-port-gui) CL="CHANGELOG-gui.md" ;;
              *)               CL="" ;;
          esac
          TAG="${{ needs.plan.outputs.tag }}"
          [ -n "$CL" ] && awk -v tag="$TAG" '
            $1 == "##" {
              v = $2
              sub(/（.*/, "", v)
              if (v == tag) { insec = 1; next }
            }
            insec && $1 == "##" { exit }
            insec { print }
          ' "$CL" > "$RUNNER_TEMP/changes.md" || true
          # 正文只放 CHANGELOG 段落,剥离 dist 生成的下载表——Assets 区就是
          # 唯一下载入口,表格纯重复(平台对照在 README);changelog 段缺失
          # 时才回落 dist 生成文案,避免空正文建版
          {
            if [ -s "$RUNNER_TEMP/changes.md" ]; then
              cat "$RUNNER_TEMP/changes.md" && echo
            else
              cat "$RUNNER_TEMP/notes.txt"
            fi
          } > "$RUNNER_TEMP/final-notes.txt"

          # 手工补丁（dist 模板硬编码 artifacts/*）：gui 链路零产物时 glob
          # 不展开会把字面量传给 gh 致 exit 1、host 挂、gui job 永不运行；
          # nullglob 下零资产即无文件参数的 create，属合法调用
          shopt -s nullglob
          files=(artifacts/*)
          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/final-notes.txt" "${files[@]}"

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

  # 套装组装：cli 归档注入最新稳定 daemon 后重传；homebrew tap 由本 job 维护
  # (dist 生成的公式 checksum 不含注入后归档，故 homebrew 发布从 dist 剥离)。
  # 依赖 host 完成(Release 已建)后才可 clobber 资产;仅 cli tag 触发。
  suite:
    # always() 同 gui job:cli 正常链 build job 必跑,此处仅防御同类 skip 传染
    if: ${{ always() && !github.event.pull_request && startsWith(github.ref_name, 'planet-port/v') && needs.host.result == 'success' }}
    needs: host
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve latest daemon release
        id: daemon
        run: |
          # cli 正式版套装取最新稳定 daemon；本次为 prerelease 时放宽到最新(含 beta)
          if gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease | grep -q true; then
            SEL='.[0]'
          else
            SEL='([.[] | select(.prerelease == false)][0])'
          fi
          TAG=$(gh api 'repos/${{ github.repository }}/releases?per_page=50' \
            --jq "[.[] | select(.tag_name | startswith(\"planet-portd/\"))] | ${SEL} | .tag_name // empty")
          [ -n "$TAG" ] || { echo "未找到 planet-portd release，先发 daemon"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Assemble suite archives
        run: |
          set -euo pipefail
          DAEMON_TAG="${{ steps.daemon.outputs.tag }}"
          mkdir -p work && cd work
          flatten() {
            # dist 归档带顶层目录(planet-port-<triple>/),剥掉平铺到根部:
            # homebrew 公式 bin.install 与 install.sh 的根部探测都按平层取
            local inner
            inner="$(find "$1" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            [ -n "$inner" ] && { mv "$inner"/* "$1/" && rmdir "$inner"; }
            return 0
          }
          for T in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --pattern "planet-port-${T}.tar.xz" --clobber
            gh release download "$DAEMON_TAG"      --repo "${{ github.repository }}" --pattern "planet-portd-${T}.tar.xz" --clobber
            mkdir -p cli dm && tar -xJf "planet-port-${T}.tar.xz" -C cli && tar -xJf "planet-portd-${T}.tar.xz" -C dm
            flatten cli
            find dm -type f -name 'planet-portd' -exec cp {} cli/ \;
            OUT="planet-port-${T}.tar.xz"
            (cd cli && tar -cJf "../$OUT" .)
            sha256sum "$OUT" > "${OUT}.sha256"
            gh release upload "$GITHUB_REF_NAME" "$OUT" "${OUT}.sha256" --clobber
            rm -rf cli dm "$OUT"
          done
          # Windows zip：cli zip 注入 daemon.exe
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --pattern "planet-port-x86_64-pc-windows-msvc.zip" --clobber
          gh release download "$DAEMON_TAG"      --repo "${{ github.repository }}" --pattern "planet-portd-x86_64-pc-windows-msvc.zip" --clobber
          mkdir -p cli dm && unzip -q "planet-port-x86_64-pc-windows-msvc.zip" -d cli \
            && unzip -q "planet-portd-x86_64-pc-windows-msvc.zip" -d dm
          flatten cli
          find dm -type f -name 'planet-portd.exe' -exec cp {} cli/ \;
          OUT="planet-port-x86_64-pc-windows-msvc.zip"
          # zip 对已存在的归档是"更新合并"不是重建,必须先删掉刚下载的同名
          # 原始 zip,否则旧嵌套条目全被带进套装包(tar -cJf 截断重建无此问题)
          rm -f "$OUT"
          (cd cli && zip -qr "../$OUT" .)
          sha256sum "$OUT" > "${OUT}.sha256"
          gh release upload "$GITHUB_REF_NAME" "$OUT" "${OUT}.sha256" --clobber
      - name: Update homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.DIST_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#planet-port/v}"
          DAEMON_VER="${{ steps.daemon.outputs.tag }}"
          DAEMON_VER="${DAEMON_VER#planet-portd/v}"
          cd work
          sha() { cat "$1.sha256" | awk '{print $1}'; }
          # 套装归档含 daemon+cli，tap 版本以 cli 为准
          export AARCH64_MAC_SHA=$(sha planet-port-aarch64-apple-darwin.tar.xz) \
                 X64_MAC_SHA=$(sha planet-port-x86_64-apple-darwin.tar.xz) \
                 X64_LINUX_SHA=$(sha planet-port-x86_64-unknown-linux-gnu.tar.xz) \
                 ARM64_LINUX_SHA=$(sha planet-port-aarch64-unknown-linux-gnu.tar.xz) \
                 REPO="${{ github.repository }}" TAG="$GITHUB_REF_NAME"
          sed -i "s/__VERSION__/$VER/" ../scripts/tap-formula.rb
          envsubst < ../scripts/tap-formula.rb > planet-port.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/planet-port/homebrew-tap.git" tap
          cp planet-port.rb tap/Formula/planet-port.rb
          cd tap && git config user.name "github-actions[bot]" \
            && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add Formula/planet-port.rb && git commit -m "planet-port $VER (daemon $DAEMON_VER)" && git push

  # GUI(Tauri)桌面安装包 + 免安装包:与 cargo-dist 产物同 tag 发布。
  # 依赖链:host 完成(Release 已建)后才上传;PR 仅 plan 不触发本 job。
  # gui 包走 dist Library Mode(dist=false 不行,它会连斜杠 tag 的包绑定一起拒绝),
  # host 只建 Release 不产 gui 二进制,桌面安装包全由本 job 提供。
  gui:
    # always() 不可省:本 job 传递依赖 build-local/global-artifacts,gui 链
    # Library Mode 零产物时它们按计划跳过,而 GitHub 会把 skip 沿 needs 图
    # 传递(即使中间 host 已用 always() 照跑),无 always() 的下游会被连带
    # 跳过——0.6.0-beta.1 三次零产物发布即栽在此
    if: ${{ always() && !github.event.pull_request && startsWith(github.ref_name, 'planet-port-gui/') && needs.host.result == 'success' }}
    needs: host
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13(2025-12)/macos-14(2026-11-02)已退役,统一 macos-15;
          # Intel dmg 在 ARM runner 上交叉编译(--target x86_64-apple-darwin)
          - os: macos-15        # Apple Silicon dmg
          - os: macos-15        # Intel dmg(交叉编译)
            target: x86_64-apple-darwin
          - os: windows-latest  # 免安装 zip(x64 便携包,替代 NSIS)
          - os: ubuntu-22.04    # AppImage x64(glibc 2.35+,与 CLI manylinux 基线不同,README 注明)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file
      # 组包脚本内含:bootstrap(拉 ZT 核心源码)→ daemon/cli 构建 → resources 组装
      # → tauri build(win 走 no-bundle 自组 planet-port-<ver>-x64-portable.zip);
      # 交叉目标经 TARGET 环境变量传入,daemon/cli 与 GUI 同 target。
      # 内嵌二进制默认拉各组件最新 release,须给 gh 登录态(GITHUB_TOKEN)
      - name: Build portable GUI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-gui-portable.sh "${TARGET}"
      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            target/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*portable.zip
          )
          echo "uploading: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
