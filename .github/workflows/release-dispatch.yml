name: Release Dispatch

# 网页发版入口：Actions 页 Run workflow 即完成「版本推导（含 beta）→ CHANGELOG →
# Cargo 版本同步 → 提交 → 打 tag → 推送」全流程，等价于本地 ./scripts/release.sh
# [beta] + git push --follow-tags。版本推导复用发版脚本本体（macOS runner 原生
# 满足 BSD sed 与 git-cliff），tag 推送后由 cargo-dist 的 Release 工作流接管
# （构建/发布/homebrew tap）。
on:
  workflow_dispatch:
    inputs:
      beta:
        description: 发布 beta 验证版（vX.Y.Z-beta.N，prerelease 形式）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    name: 版本推导与打 tag
    runs-on: macos-15
    steps:
      # 推 tag 用 DIST_RELEASE_TOKEN：GITHUB_TOKEN 推送的事件不会触发其它
      # 工作流（GitHub 限制），cargo-dist 的 Release 管线必须由真实 tag 推送
      # 事件驱动；该 token 已有 homebrew-tap 仓库写权限（同 PAT）
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 git-cliff
        run: brew install git-cliff

      # cargo update -w（release.sh 内）需要 cargo
      - uses: dtolnay/rust-toolchain@stable

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 执行发版脚本
        run: |
          if [ "${{ inputs.beta }}" = "true" ]; then
            ./scripts/release.sh beta
          else
            ./scripts/release.sh
          fi

      - name: 推送发版提交与 tag
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
