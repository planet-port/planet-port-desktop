[workspace]
resolver = "2"
members = ["crates/api", "crates/cli", "crates/zt-sys", "crates/zt-core", "crates/pocs", "crates/poc4"]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/planet-port/planet-port-desktop"
homepage = "https://github.com/planet-port/planet-port-desktop"
description = "Multi-planet ZeroTier client"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cargo-dist 发布配置：tag push → CI 五目标构建 → GitHub Releases + homebrew tap
[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
allow-dirty = ["ci"]                # release.yml 含手工 token 替换，跳过 CI 再生成比对
ci = "github"
installers = ["homebrew"]
publish-jobs = ["homebrew"]
tap = "planet-port/homebrew-tap"
publish-prereleases = true            # -beta.N tag 也要发 prerelease 并更新 tap
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin",
           "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
           "x86_64-pc-windows-msvc"]
include = ["third_party/wintun/wintun.dll", "scripts/install-offline.ps1"]
checksum = "sha256"
github-build-setup = "../dist-build-setup.yml"   # dist 以 .github/workflows/ 为基准拼接；../ 移出 workflows 目录避免被 GitHub 当作 workflow 解析

# Linux 目标在 manylinux_2_28(AlmaLinux 8, glibc 2.28)容器内构建，兼容
# RHEL/Rocky 8、Ubuntu 20.04、Debian 11 等仍在线的旧发行版(此前 ubuntu-22.04
# runner 产物要求 glibc ≥2.34，RK3566 Ubuntu 20.04 无法运行)。aarch64 用
# arm runner + aarch64 镜像原生构建(ZeroTier Core 是 C++，不做交叉编译)。
# container.host 必须填 musl：容器内安装的 dist 自身走静态 musl 二进制，
# 与容器 glibc 版本无关(cargo-dist 官方文档同款写法)。
[workspace.metadata.dist.github-custom-runners.x86_64-unknown-linux-gnu.container]
image = "quay.io/pypa/manylinux_2_28_x86_64"
host = "x86_64-unknown-linux-musl"

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-22.04-arm"

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-gnu.container]
image = "quay.io/pypa/manylinux_2_28_aarch64"
host = "aarch64-unknown-linux-musl"

# cargo-dist 构建专用 profile(其 build 硬编码 --profile dist)
[profile.dist]
inherits = "release"
lto = "thin"
