[package]
name = "planet-port"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ureq = "3"
# 表格列宽按显示宽度对齐(CJK 全角占 2);树内已有该依赖
unicode-width = "0.1"
serde.workspace = true
serde_json.workspace = true
planet-port-api = { path = "../api" }
# geteuid(service 子命令 root 判定);workspace 已有同版本依赖,MIT/Apache-2.0
libc = "0.2"
rust-i18n = "3"
sys-locale = "0.3.2"
# 时间戳本地化(events TS / planet show revision / share expires_at);MIT/Apache-2.0
chrono = "0.4"

# Windows 服务管理(service/windows.rs):管理员令牌判定(TokenElevation)。
# 仅 Windows 目标引入,MIT/Apache-2.0;版本对齐 daemon/zt-core 既有 0.59
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # Machine PATH 注册(service/windows.rs):注册表读写 + WM_SETTINGCHANGE 广播
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
