[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "planet-portd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# signal:SIGINT/SIGTERM 优雅退出;sync:watch 停止通道(Windows 服务停止)与既有 sync::Mutex
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
planet-port-api = { path = "../api" }
# Task 4 接入 NodeRuntime 时使用,先引入
zt-core = { path = "../zt-core" }
# daemon.lock 单实例守卫的 flock(与 cli/zt-core 同版本);MIT/Apache-2.0
libc = "0.2"
# planet URL 导入的 HTTP 下载(MIT/Apache-2.0)
ureq = "3"

# Windows 平台 API:命名互斥体单例锁(Threading/Foundation)+ 随机数
# (Security_Cryptography 的 BCryptGenRandom)+ SCM 服务入口
# (System_Services 的 StartServiceCtrlDispatcherW);仅 Windows 目标引入,
# MIT/Apache-2.0。版本对齐 workspace 既有 0.59
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_System_Services",
] }
