[package]
name = "planet-port-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "planet-port 桌面 GUI（Tauri 薄客户端）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
planet-port-api = { path = "../../api" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
ureq = "3"

# Windows UAC 提权拉起安装子进程(bootstrap.rs):ShellExecuteW 的 runas 动词。
# 仅 Windows 目标引入,MIT/Apache-2.0;版本对齐 cli 既有 0.59。
# ShellExecuteW 挂在 UI::Shell 模块,但其签名引用 WindowsAndMessaging 的
# SHOW_WINDOW_CMD,须三 feature 同开(Foundation 提供 HWND/HINSTANCE 别名)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
