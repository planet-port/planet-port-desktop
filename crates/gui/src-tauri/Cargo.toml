[package]
name = "planet-port-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "planet-port 桌面 GUI（Tauri 薄客户端）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
planet-port-api = { path = "../../api" }
