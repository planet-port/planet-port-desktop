[package]
name = "planet-port-gui"
version = "0.5.1-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "planet-port 桌面 GUI（Tauri 薄客户端）"

# GUI 不经 cargo-dist 直构:构建链是 pnpm tauri build(前端产物 + bundle),
# Linux 容器无 webkit2gtk/glib 系统库必挂;dist 按工作区全 dist-able 包规划,
# v0.4.0 后 gui 入区即被卷入(2026-11-24 v0.5.0-beta.1 实测),显式排除
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
planet-port-api = { path = "../../api" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
ureq = "3"
# 构建时间 epoch → 查看者本地时区格式化(关于页);MIT/Apache-2.0
chrono = "0.4"

# 保存/选择文件对话框(二维码保存 PNG、planet 导出、身份文件选择)
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# Windows UAC 提权拉起安装子进程(bootstrap.rs):ShellExecuteW 的 runas 动词。
# 仅 Windows 目标引入,MIT/Apache-2.0;版本对齐 cli 既有 0.59。
# ShellExecuteW 挂在 UI::Shell 模块,但其签名引用 WindowsAndMessaging 的
# SHOW_WINDOW_CMD,须三 feature 同开(Foundation 提供 HWND/HINSTANCE 别名)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
